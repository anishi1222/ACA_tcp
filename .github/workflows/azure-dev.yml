# 自動デプロイ (CI/CD)。
#   main への push                : テスト → azd provision → azd deploy
#   プルリクエスト                : テストだけ
#   手動実行 (workflow_dispatch)  : main で実行すると、push と同じくデプロイまで行います
#
# azd deploy は、ソースを Azure Container Registry (ACR) の ACR Tasks でビルドして ACR に push し、
# そのイメージで Container Apps の新しいリビジョンを作ります (アプリはマネージド ID で ACR から pull します)。
# ビルドは ACR 上で行うため、ランナーに Docker は要りません。
#
# Azure へのログインは OpenID Connect (フェデレーション資格情報) で行い、クライアントシークレットは使いません。
# 初回に 1 度だけ、ローカルで azd pipeline config を実行します (README の「自動デプロイ」を参照)。
# Azure 側の ID を作成した後、次の値を GitHub Actions のリポジトリシークレットに登録します。
#   AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID / AZURE_ENV_NAME / AZURE_LOCATION
# 下記で参照するシークレットのうち、値のあるものだけを azd に渡します。
name: azure-dev

on:
  push:
    branches: [main]
    paths:
      - app-a/**
      - app-b/**
      - infra/**
      - azure.yaml
      - pom.xml
      - .github/workflows/azure-dev.yml
  pull_request:
    branches: [main]
    paths:
      - app-a/**
      - app-b/**
      - pom.xml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Test
        run: mvn -B -ntp verify

  deploy:
    # デプロイするのは main だけです (azd pipeline config のフェデレーション資格情報も main 向けです)。
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read
    # 同じ Azure 環境へ同時にデプロイしないよう、1 つずつ順番に実行します。
    concurrency:
      group: azure-dev-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # デプロイに必要なシークレットだけを参照し、値のあるものだけを環境変数にします。
      # 未設定の変数を env: に並べると空文字で渡り、Bicep の既定値 (名前の自動生成など) が使われなくなるためです。
      - name: Load deployment secrets
        env:
          DEPLOYMENT_SECRETS: |
            {
              "AZURE_CLIENT_ID": ${{ toJSON(secrets.AZURE_CLIENT_ID) }},
              "AZURE_TENANT_ID": ${{ toJSON(secrets.AZURE_TENANT_ID) }},
              "AZURE_SUBSCRIPTION_ID": ${{ toJSON(secrets.AZURE_SUBSCRIPTION_ID) }},
              "AZURE_ENV_NAME": ${{ toJSON(secrets.AZURE_ENV_NAME) }},
              "AZURE_LOCATION": ${{ toJSON(secrets.AZURE_LOCATION) }},
              "AZURE_RESOURCE_GROUP": ${{ toJSON(secrets.AZURE_RESOURCE_GROUP) }},
              "AZURE_APP_A_VNET_NAME": ${{ toJSON(secrets.AZURE_APP_A_VNET_NAME) }},
              "AZURE_APP_A_SUBNET_NAME": ${{ toJSON(secrets.AZURE_APP_A_SUBNET_NAME) }},
              "AZURE_APP_B_VNET_NAME": ${{ toJSON(secrets.AZURE_APP_B_VNET_NAME) }},
              "AZURE_APP_B_SUBNET_NAME": ${{ toJSON(secrets.AZURE_APP_B_SUBNET_NAME) }},
              "AZURE_APP_B_PE_SUBNET_NAME": ${{ toJSON(secrets.AZURE_APP_B_PE_SUBNET_NAME) }},
              "AZURE_NAME_SUFFIX": ${{ toJSON(secrets.AZURE_NAME_SUFFIX) }},
              "AZURE_CONTAINER_REGISTRY_NAME": ${{ toJSON(secrets.AZURE_CONTAINER_REGISTRY_NAME) }},
              "AZURE_APP_A_IMAGE": ${{ toJSON(secrets.AZURE_APP_A_IMAGE) }},
              "AZURE_APP_B_IMAGE": ${{ toJSON(secrets.AZURE_APP_B_IMAGE) }}
            }
        run: |
          missing=0
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_ENV_NAME AZURE_LOCATION; do
            if ! jq -e --arg name "$name" '(.[$name] // "") != ""' <<<"$DEPLOYMENT_SECRETS" >/dev/null; then
              echo "::error::GitHub Actions のリポジトリシークレット ${name} が未設定です。Settings → Secrets and variables → Actions → Secrets に登録してください (README の「自動デプロイ」を参照)。"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          if jq -e 'any(.[]; contains("\n") or contains("\r"))' <<<"$DEPLOYMENT_SECRETS" >/dev/null; then
            echo "::error::Azure 用のシークレットは改行を含まない値で設定してください。"
            exit 1
          fi
          jq -r 'to_entries[]
            | select(.key | startswith("AZURE_"))
            | select(.value != "")
            | "\(.key)=\(.value)"' <<<"$DEPLOYMENT_SECRETS" >> "$GITHUB_ENV"

      - name: Install azd
        uses: Azure/setup-azd@v2

      - name: Log in with azd (federated credentials)
        run: |
          azd auth login \
            --client-id "$AZURE_CLIENT_ID" \
            --federated-credential-provider github \
            --tenant-id "$AZURE_TENANT_ID"

      # ACR・マネージド ID・VNET・Container Apps など、infra/ の内容を反映します。
      # 既存のアプリは、現在のイメージ (ACR のもの) を維持します。
      - name: Provision infrastructure
        run: azd provision --no-prompt

      # ACR Tasks でビルド → ACR に push → Container Apps が ACR から pull して新しいリビジョンに切り替えます。
      - name: Build, push to ACR and deploy
        run: azd deploy --no-prompt
