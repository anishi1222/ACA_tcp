name: Trigger auto deployment for app-b

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/app-b-AutoDeployTrigger-b8d05af9-1f36-4e1b-b09c-aa335dde535b.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.APPB_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.APPB_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.APPB_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: acrwizym2vmxzfk6.azurecr.io
          registryUsername: ${{ secrets.APPB_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.APPB_REGISTRY_PASSWORD }}
          containerAppName: app-b
          resourceGroup: rg-acatcp-vezzog
          imageToBuild: acrwizym2vmxzfk6.azurecr.io/app-b:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


