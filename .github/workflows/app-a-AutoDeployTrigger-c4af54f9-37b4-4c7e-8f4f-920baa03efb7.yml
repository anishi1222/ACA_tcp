name: Trigger auto deployment for app-a

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/app-a-AutoDeployTrigger-c4af54f9-37b4-4c7e-8f4f-920baa03efb7.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.APPA_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.APPA_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.APPA_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: acrwizym2vmxzfk6.azurecr.io
          registryUsername: ${{ secrets.APPA_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.APPA_REGISTRY_PASSWORD }}
          containerAppName: app-a
          resourceGroup: rg-acatcp-vezzog
          imageToBuild: acrwizym2vmxzfk6.azurecr.io/app-a:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


